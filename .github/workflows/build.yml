name: Build
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          unzip -o ./*.zip
          POM=$(find . -name pom.xml | head -1)
          echo "Using $POM"
          mvn -B -f "$POM" clean package
          JAR=$(find . -path "*target*" -name "*.jar" ! -name "original-*" | head -1)
          echo "Jar: $JAR"
          gh release create build-${{ github.run_number }} "$JAR" --title "EMBERSMP jar" --notes "Built jar"

name: Build
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -o ./*.zip
      - run: cd EMBERSMP && mvn -B clean package
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create build-${{ github.run_number }} EMBERSMP/target/EMBERSMP.jar --title "EMBERSMP jar" --notes "Built jar"
